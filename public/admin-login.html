<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <title>Admin Login — Printing Store</title>
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    /* ---- Admin Login Page Styles ---- */
    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4ff;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(37,99,235,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(37,99,235,0.05) 0%, transparent 50%);
      background-attachment: fixed;
      padding-bottom: 0;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(37,99,235,0.1);
      border-radius: 20px;
      padding: 40px 32px 36px;
      box-shadow:
        0 8px 32px rgba(37,99,235,0.08),
        0 1px 3px rgba(0,0,0,0.04);
      animation: slideUpLogin 0.5s ease-out both;
    }

    @keyframes slideUpLogin {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* --- Logo Icon --- */
    .login-logo {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.3);
    }
    .login-logo svg {
      width: 28px; height: 28px; color: #fff; stroke-width: 2;
    }

    .login-title {
      text-align: center;
      font-size: 1.4em;
      font-weight: 800;
      color: #1e293b;
      margin: 0 0 4px;
      letter-spacing: -0.5px;
    }
    .login-subtitle {
      text-align: center;
      font-size: 0.82em;
      color: #6b7280;
      margin: 0 0 28px;
    }

    /* --- Input Group --- */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 0.78em;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .input-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-row input {
      width: 100%;
      padding: 12px 48px 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95em;
      font-family: inherit;
      color: #1e293b;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .input-row input::placeholder {
      color: #9ca3af;
    }

    /* --- Toggle Password Button --- */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%; transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; padding: 4px;
      color: #9ca3af;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: #2563eb; }
    .toggle-pw svg { width: 20px; height: 20px; }

    /* --- Login Button --- */
    .login-btn {
      width: 100%;
      padding: 13px 0;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 0.95em;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .login-btn svg { width: 18px; height: 18px; }

    /* --- Error Message --- */
    .error-msg {
      text-align: center;
      color: #ef4444;
      font-size: 0.82em;
      font-weight: 600;
      margin-top: 16px;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .error-msg.visible {
      opacity: 1;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* --- Footer --- */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.72em;
      color: #9ca3af;
    }

    /* --- Spinner for loading --- */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .login-btn.loading .spinner { display: block; }
    .login-btn.loading .btn-text { display: none; }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px 28px;
        border-radius: 16px;
      }
      .login-title { font-size: 1.2em; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <!-- Shield/Lock icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Enter your password to access the dashboard</p>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-row">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter admin password"
              autocomplete="current-password"
              required
              autofocus
            >
            <button type="button" class="toggle-pw" id="togglePw" onclick="togglePassword()" title="Show/Hide Password">
              <!-- Eye icon (show) -->
              <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye-off icon (hide) — hidden by default -->
              <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Login</span>
          <div class="spinner"></div>
        </button>
      </form>

      <!-- Error display -->
      <div class="error-msg" id="errorMsg"></div>

      <div class="login-footer">Kadam Xerox &middot; Admin Panel</div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------
    //  If already logged in, skip to admin dashboard
    // -------------------------------------------------------
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
      window.location.replace('/admin-dashboard');
    }

    // -------------------------------------------------------
    //  Show / Hide Password
    // -------------------------------------------------------
    function togglePassword() {
      var input = document.getElementById('password');
      var show  = document.getElementById('eyeShow');
      var hide  = document.getElementById('eyeHide');

      if (input.type === 'password') {
        input.type = 'text';
        show.style.display = 'none';
        hide.style.display = 'block';
      } else {
        input.type = 'password';
        show.style.display = 'block';
        hide.style.display = 'none';
      }
    }

    // -------------------------------------------------------
    //  Handle Login
    // -------------------------------------------------------
    function handleLogin(e) {
      e.preventDefault();

      var password = document.getElementById('password').value;
      var btn      = document.getElementById('loginBtn');
      var errorEl  = document.getElementById('errorMsg');

      // Hide any previous error
      errorEl.classList.remove('visible');
      errorEl.textContent = '';

      if (!password) {
        showError('Please enter the password');
        return;
      }

      // Show loading state
      btn.classList.add('loading');
      btn.disabled = true;

      // Send password to the server for verification
      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        btn.classList.remove('loading');
        btn.disabled = false;

        if (data.success) {
          // Save session token in sessionStorage (cleared when browser closes)
          sessionStorage.setItem('adminLoggedIn', 'true');
          sessionStorage.setItem('adminToken', data.token);
          // Redirect to admin dashboard
          window.location.replace('/admin-dashboard');
        } else {
          showError(data.error || 'Wrong Password');
        }
      })
      .catch(function() {
        btn.classList.remove('loading');
        btn.disabled = false;
        showError('Server error. Please try again.');
      });
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      // Force re-trigger animation
      el.classList.remove('visible');
      void el.offsetWidth; // reflow
      el.classList.add('visible');
    }
  </script>

</body>
</html>
