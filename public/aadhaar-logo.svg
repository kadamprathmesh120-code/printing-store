<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Sun Rays / Petals -->
  <g fill="#F59E0B">
    <!-- Center ray -->
    <path d="M 200 10 L 216 45 C 205 48 195 48 184 45 Z" />
    <!-- Ray 1 Right -->
    <path d="M 245 22 L 250 58 C 240 59 230 57 221 53 Z" />
    <!-- Ray 2 Right -->
    <path d="M 285 48 L 277 82 C 268 80 260 76 253 70 Z" />
    <!-- Ray 3 Right -->
    <path d="M 315 85 L 293 113 C 287 108 281 102 277 95 Z" />
    <!-- Ray 4 Right -->
    <path d="M 330 128 L 297 144 C 294 137 290 129 285 122 Z" />
    
    <!-- Ray 1 Left -->
    <path d="M 155 22 L 179 53 C 170 57 160 59 150 58 Z" />
    <!-- Ray 2 Left -->
    <path d="M 115 48 L 147 70 C 140 76 132 80 123 82 Z" />
    <!-- Ray 3 Left -->
    <path d="M 85 85 L 123 95 C 119 102 113 108 107 113 Z" />
    <!-- Ray 4 Left -->
    <path d="M 70 128 L 115 122 C 110 129 106 137 103 144 Z" />
  </g>

  <!-- Red Semicircle with Fingerprint Pattern -->
  <g transform="translate(200, 145)">
    <!-- Base background semicircle -->
    <path d="M -115 0 A 115 115 0 0 1 115 0 Z" fill="#DC2626" />
    
    <!-- White Fingerprint Arcs -->
    <!-- Outer Arc -->
    <path d="M -98 0 A 98 98 0 0 1 98 0" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <!-- Arc 2 -->
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <!-- Arc 3 with core loops -->
    <path d="M -62 0 A 62 62 0 0 1 62 0" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <!-- Arc 4 -->
    <path d="M -44 0 A 44 44 0 0 1 44 0" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <!-- Arc 5 -->
    <path d="M -26 0 A 26 26 0 0 1 26 0" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <!-- Inner loop -->
    <path d="M -10 0 A 10 10 0 0 1 10 0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    
    <!-- Fingerprint ridge details / breaks -->
    <path d="M -50 -35 A 62 62 0 0 1 -15 -60" fill="none" stroke="#DC2626" stroke-width="11" />
    <path d="M 25 -57 A 62 62 0 0 1 55 -28" fill="none" stroke="#DC2626" stroke-width="11" />
    <path d="M -30 -28 A 44 44 0 0 1 -10 -43" fill="none" stroke="#DC2626" stroke-width="10" />
    <path d="M 12 -42 A 44 44 0 0 1 35 -24" fill="none" stroke="#DC2626" stroke-width="10" />
  </g>

  <!-- Bottom Divider Line -->
  <line x1="60" y1="148" x2="340" y2="148" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />

  <!-- AADHAAR Text -->
  <text x="200" y="185" font-family="'Arial Black', 'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#B91C1C" text-anchor="middle" letter-spacing="6">AADHAAR</text>
</svg>
